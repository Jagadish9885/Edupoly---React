<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h1>Introduction to React</h1>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <script type="text/babel">
        var x = document.createElement("h1")
        x.innerHTML = "Hello React";
        x.style.color ="red"
        document.getElementById("d1").appendChild(x);

        // creating an element using react
        var y = React.createElement("h1", {style:{color:"green"}}, "Hello React using React");
        ReactDOM.render(y, document.getElementById("d2"));

        function abc(){
            alert("Hello from React using JSX");
        }

        var z = <h1 style={{color:"blue"}} onClick={abc}>Hello React using JSX</h1>;
        ReactDOM.render(z, document.getElementById("d3"));


        var ar = [10,20,30,40,50];
        var z = <ul>
            {ar.map((i)=>{
                return <li>{i}</li>
            })}
            </ul>
            console.log(ar)
            ReactDOM.render(z, document.getElementById("d4"));


    </script>
</body>
</html>
